services:
  - type: web
    name: obligo-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: OBLIGO_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: MCP_BEARER_TOKEN
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: MCP_ALLOWED_HOSTS
        sync: false
      - key: MCP_ALLOWED_ORIGINS
        sync: false
      - key: WORKSPACE_TIMEZONE
        value: UTC
